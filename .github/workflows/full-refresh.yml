name: Full refresh (NHS + Private + NHS Services)
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"   # daily 5am UTC
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests pandas numpy pyyaml

      # ---- 0. Accepting-new-patients flags (needs NHS_SERVICE_SEARCH_KEY;
      #         skips gracefully when the secret is missing) ----
      - name: Fetch accepting-new-patients flags
        env:
          NHS_SERVICE_SEARCH_KEY: ${{ secrets.NHS_SERVICE_SEARCH_KEY }}
        run: python fetch_accepting_patients.py
        continue-on-error: true

      # ---- 1. NHS GP data (canonical via FHIR) ----
      # NOTE: refresh_nhs_data.py must NOT write index.html — it runs
      # before private clinics even exist, so any counts it writes are
      # always wrong. index.html is now only written at the very end,
      # by regenerate_index_from_stats.py.
      # ---- 1a. Apply GP Patient Survey scores into gps.json BEFORE the NHS
      #          refresh reads it, so satisfaction / contact-ease figures are
      #          carried into every practice. Source of truth is the committed
      #          gpps_slim.csv (regenerated locally once a year — the survey
      #          site blocks CI IPs; see apply_gpps_scores.py). ----
      - name: Apply GP Patient Survey scores
        run: python apply_gpps_scores.py

      # ---- 1b. NHS Service Search enrichment (official name, address, phone,
      #          website, precise coordinates, opening hours). Writes
      #          nhs_service_search.json, which the NHS refresh below merges in.
      #          Skips gracefully if the secret is missing or the API blips —
      #          refresh_nhs_data.py then falls back to the last committed cache. ----
      - name: Fetch NHS Service Search enrichment
        env:
          NHS_SERVICE_SEARCH_KEY: ${{ secrets.NHS_SERVICE_SEARCH_KEY }}
        run: python fetch_nhs_service_search.py
        continue-on-error: true

      # ---- 1c. London pharmacies, direct from Service Search (ODS-keyed).
      #          Writes pharmacies.json for build_pharmacy_pages.py. Bounded +
      #          non-fatal: a blip falls back to the last committed dataset. ----
      - name: Fetch London pharmacies
        env:
          NHS_SERVICE_SEARCH_KEY: ${{ secrets.NHS_SERVICE_SEARCH_KEY }}
        run: python fetch_pharmacies.py
        continue-on-error: true
        timeout-minutes: 15

      - name: NHS refresh
        run: python refresh_nhs_data.py
      - name: Strip non-GP NHS records
        run: python clean_nhs_records.py

      # ---- 2. CQC cache (incremental — only fetches NEW location IDs) ----
      # Guarded: a slow/unresponsive CQC API must never block the build +
      # commit + deploy. On timeout/failure we fall back to the last committed
      # cache (CQC data is non-critical enrichment; the site works without a
      # refresh of it).
      - name: Update CQC London cache
        env:
          CQC_KEY: ${{ secrets.CQC_KEY }}
        run: python build_cqc_london_cache.py
        continue-on-error: true
        timeout-minutes: 25

      # ---- 2b. Verify external links (CQC website URLs go stale) ----
      - name: Check external links
        run: python check_external_links.py
        continue-on-error: true
        timeout-minutes: 15

      # ---- 3. Generate JSONs from cache ----
      - name: Generate private clinics by specialty
        run: python gen_private_clinics.py
      - name: Generate dentists
        run: python gen_dentists.py
      - name: Generate NHS specialty services
        run: python gen_nhs_specialties.py

      # ---- 4. Merge + clean ----
      - name: Merge into index.html + write merged.json
        run: python merge_into_dataset.py
      - name: Normalize website URLs
        run: python normalize_urls.py
      # Guarded: this CQC-API step hung ~44 min and timed out the whole job on
      # 2026-09-09, blocking the deploy. Bounded + non-fatal so the pipeline
      # always reaches the build/commit steps.
      - name: Backfill missing CQC ratings
        env:
          CQC_KEY: ${{ secrets.CQC_KEY }}
        run: python enrich_cqc_ratings.py
        continue-on-error: true
        timeout-minutes: 10
      - name: Drop non-GMS NHS records
        run: python drop_non_gms.py
      - name: Fix borough assignments
        run: python fix_boroughs.py
      - name: Fetch CQC key-question ratings
        env:
          CQC_KEY: ${{ secrets.CQC_KEY }}
        run: python fetch_cqc_domain_ratings.py
        continue-on-error: true
        timeout-minutes: 15

      # ---- 4b. Canonical stats — MUST run after all cleanup above and
      #          before any page-building step below. compute_stats.py
      #          excludes non-London records (empty borough field) so
      #          its counts match what build_borough_index.py sums.
      #          regenerate_index_from_stats.py is now the ONLY script
      #          allowed to write index.html's count placeholders. ----
      - name: Compute canonical stats
        run: python compute_stats.py
      - name: Regenerate index.html from stats
        run: python regenerate_index_from_stats.py

      # ---- 5. Build pages ----
      - name: Build borough pages
        run: python build_borough_pages.py
      - name: Build practice pages
        run: python build_practice_pages.py
      - name: Build specialty hub pages (private)
        run: python build_specialty_pages.py
      - name: Build dentist pages
        run: python build_dentist_pages.py
      - name: Build borough index page
        run: python build_borough_index.py
      - name: Build NHS services pages
        run: python build_nhs_services_pages.py
      - name: Build pharmacy pages
        run: python build_pharmacy_pages.py
      - name: Build unified sitemap
        run: python build_sitemap_unified.py

      # ---- 6. Commit ----
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Full refresh ($(date -u +%Y-%m-%d))"
          # Push back to the branch this run was triggered on: scheduled runs
          # use the default branch (main) exactly as before; a manual run on a
          # feature branch commits there (Vercel preview), never prod.
          BRANCH="${{ github.ref_name }}"
          for i in {1..3}; do
            git pull --rebase origin "$BRANCH"
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 5
          done
          exit 1
