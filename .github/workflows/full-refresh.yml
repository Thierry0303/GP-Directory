name: Full refresh (NHS + Private + Merge)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests pandas numpy pyyaml

      # ---- 1. NHS GP data ----
      - name: NHS refresh (ODS FHIR)
        run: python refresh_nhs_data.py
      - name: Strip non-GP NHS records
        run: python clean_nhs_records.py

      # ---- 2. CQC cache (incremental update) ----
      - name: Update CQC London cache (incremental, fast)
        env:
             CQC_KEY: ${{ secrets.CQC_KEY }}
        run: python build_cqc_london_cache.py

      - name: Generate private clinics from cache
        run: python gen_private_clinics.py

      # ---- 3. Generate JSONs from cache ----
      - name: Generate NHS GPs from cache
        run: python gen_nhs_gps.py
      - name: Generate private clinics by specialty
        run: python gen_private_clinics.py
      - name: Generate NHS specialty services
        run: python gen_nhs_specialties.py

      # ---- 4. Merge + clean ----
      - name: Merge NHS + private + rebuild index.html
        run: python merge_into_dataset.py
      - name: Normalize website URLs
        run: python normalize_urls.py
      - name: Backfill missing CQC ratings (uses cache too)
        env:
          CQC_KEY: ${{ secrets.CQC_KEY }}
        run: python enrich_cqc_ratings.py
      - name: Drop non-GMS NHS records
        run: python drop_non_gms.py
      - name: Fix borough assignments
        run: python fix_boroughs.py

      # ---- 5. Build pages ----
      - name: Build borough pages
        run: python build_borough_pages.py
      - name: Build practice pages
        run: python build_practice_pages.py
      - name: Build specialty hub pages
        run: python build_specialty_pages.py
      - name: Build borough index page
        run: python build_borough_index.py

      # ---- 6. Commit ----
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Full refresh ($(date -u +%Y-%m-%d))"
            for i in {1..3}; do
              git pull --rebase origin main
              if git push origin main; then exit 0; fi
              sleep 5
            done
            exit 1
          fi
