name: Build CQC London cache (one-time, ~45 min)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build cache
        env:
          CQC_KEY: ${{ secrets.CQC_KEY }}
        run: python build_cqc_london_cache.py
      - name: Commit cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cqc_london_cache.json.gz cqc_london_cache.meta.json
          git commit -m "Update CQC London cache" || echo "no changes"
          git push
