name: Build CQC London cache (one-time / weekly)
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * MON"
permissions:
  contents: write
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build / update CQC London cache
        env:
          CQC_KEY: ${{ secrets.CQC_KEY }}
        run: python build_cqc_london_cache.py

      - name: Enrich cache with provider names
        env:
          CQC_KEY: ${{ secrets.CQC_KEY }}
        run: python enrich_provider_names.py

      - name: Commit cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cqc_london_cache.json.gz cqc_london_cache.meta.json
          git diff --cached --quiet || git commit -m "Update CQC London cache ($(date -u +%Y-%m-%d))"
          git push
