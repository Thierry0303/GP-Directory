name: Refresh GP Patient Survey scores

# Downloads the annual GP Patient Survey "Practice data (weighted)" CSV,
# regenerates gpps_slim.csv, and commits it when the scores change. The daily
# Full refresh then applies them site-wide (apply_gpps_scores.py).
#
# The correct download link is discovered by scraping the public downloads page,
# so this keeps working when the survey year / URL path changes. gp-patient.co.uk
# serves an incomplete TLS chain, so we rebuild the CA bundle with the missing
# intermediate rather than disabling verification. If the site is ever
# unreachable or its page layout changes, the job fails without touching
# anything and the README documents the local fallback.

on:
  workflow_dispatch:
    inputs:
      csv_url:
        description: "Full CSV download URL (skips auto-discovery if set)"
        required: false
        default: ""
  schedule:
    - cron: "0 6 1 * *"   # 1st of each month, 06:00 UTC

permissions:
  contents: write

env:
  GPPS_HOST: gp-patient.co.uk
  DOWNLOADS_PAGE: https://gp-patient.co.uk/downloads

jobs:
  refresh-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build CA bundle with missing intermediate
        id: ca
        run: |
          set -uo pipefail
          BUNDLE=/tmp/gpps_cabundle.pem
          cp /etc/ssl/certs/ca-certificates.crt "$BUNDLE"
          # The server omits the intermediate CA; fetch the issuer named in the
          # leaf certificate's AIA extension and append it (verification stays on).
          LEAF=$(openssl s_client -connect "$GPPS_HOST:443" -servername "$GPPS_HOST" </dev/null 2>/dev/null | openssl x509 2>/dev/null || true)
          AIA=$(printf '%s' "$LEAF" | openssl x509 -noout -text 2>/dev/null \
                | grep -o 'CA Issuers - URI:http[^ ]*' | sed 's/^.*URI://' | head -1)
          if [ -n "$AIA" ]; then
            echo "Fetching intermediate: $AIA"
            curl -fsSL --max-time 60 "$AIA" -o /tmp/inter.raw || true
            if openssl x509 -inform DER -in /tmp/inter.raw -out /tmp/inter.pem 2>/dev/null \
               || openssl x509 -inform PEM -in /tmp/inter.raw -out /tmp/inter.pem 2>/dev/null; then
              cat /tmp/inter.pem >> "$BUNDLE"; echo "Intermediate appended."
            fi
          fi
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Discover CSV download URL
        id: url
        run: |
          set -uo pipefail
          UA="Mozilla/5.0 (compatible; GP-Directory-refresh/1.0)"
          OVERRIDE="${{ github.event.inputs.csv_url }}"
          if [ -n "$OVERRIDE" ]; then
            echo "Using provided csv_url."
            echo "url=$OVERRIDE" >> "$GITHUB_OUTPUT"; exit 0
          fi
          curl -fsSL --cacert "${{ steps.ca.outputs.bundle }}" -A "$UA" \
            --max-time 120 "$DOWNLOADS_PAGE" -o /tmp/downloads.html
          # Pull every FileDownload link, then pick the practice-level, weighted,
          # CSV one (the raw per-practice data — not the Excel or region files).
          python3 - <<'PY' > /tmp/csv_url.txt
          import html, re, sys
          page = open("/tmp/downloads.html", encoding="utf-8", errors="replace").read()
          links = [html.unescape(m) for m in re.findall(r'''(?:href=["']|)((?:https?://[^"'<> ]+)?/FileDownload/Download[^"'<> ]+)''', page)]
          def score(u):
              lu = u.lower()
              s = 0
              if "practice" in lu: s += 2
              if "practice_data" in lu or "practice-data" in lu: s += 3
              if "weighted" in lu: s += 2
              if lu.endswith(".csv") or "csv" in lu: s += 3
              if "excel" in lu or lu.endswith(".xlsx"): s -= 5
              if "region" in lu or "national" in lu or "ccg" in lu or "pcn" in lu: s -= 3
              return s
          cands = sorted(set(links), key=score, reverse=True)
          for u in cands[:15]:
              print("CAND", score(u), u, file=sys.stderr)
          best = cands[0] if cands and score(cands[0]) > 0 else ""
          if best and best.startswith("/"):
              best = "https://gp-patient.co.uk" + best
          print(best)
          PY
          echo "---- candidates ----"; sed -n 's/^/  /p' /tmp/downloads.html >/dev/null 2>&1 || true
          URL="$(cat /tmp/csv_url.txt)"
          if [ -z "$URL" ]; then
            echo "::error::Could not find the practice CSV link on $DOWNLOADS_PAGE. Re-run with a csv_url input, or refresh locally (see README)."
            exit 1
          fi
          echo "Resolved CSV URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download practice CSV
        run: |
          set -o pipefail
          curl --fail --location --retry 3 --retry-delay 10 --max-time 900 \
            --cacert "${{ steps.ca.outputs.bundle }}" \
            -A "Mozilla/5.0 (compatible; GP-Directory-refresh/1.0)" \
            -o gpps_practice.csv "${{ steps.url.outputs.url }}"
          bytes=$(wc -c < gpps_practice.csv)
          echo "Downloaded $bytes bytes"
          if [ "$bytes" -lt 1000000 ]; then
            echo "::error::Downloaded file is too small ($bytes bytes) — not the CSV. First bytes:"; head -c 300 gpps_practice.csv || true; exit 1
          fi
          if ! head -1 gpps_practice.csv | grep -qi "overallexp"; then
            echo "::error::CSV header has no 'overallexp' column — not the expected GPPS practice file."; exit 1
          fi

      - name: Regenerate gpps_slim.csv
        run: |
          python3 extract_gpps_scores.py gpps_practice.csv
          rm -f gpps_practice.csv          # never commit the ~97 MB source

      - name: Apply scores and commit if changed
        run: |
          python3 apply_gpps_scores.py
          if git diff --quiet -- gpps_slim.csv gps.json; then
            echo "No score changes — nothing to commit."; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gpps_slim.csv gps.json
          git commit -m "Refresh GP Patient Survey scores"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
